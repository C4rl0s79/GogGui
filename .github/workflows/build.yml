name: Build & Publish GogGui

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build GogGui (WinUI 3 unpackaged / x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to .NET 8 — dotnet SDK 10 ships on windows-latest and breaks
      # Windows App SDK PRI tasks that rely on VS MSBuild internals.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Install the UWP / WinAppSDK workload that provides
      # Microsoft.Build.Packaging.Pri.Tasks.dll required by MrtCore.PriGen.
      - name: Install Windows App SDK build tools
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.NuGet `
            -property installationPath
          $installer = Join-Path $vsPath 'Common7\IDE\VSIXInstaller.exe'
          # Install UWP workload via VS installer
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
            modify `
            --installPath $vsPath `
            --add Microsoft.VisualStudio.Workload.Universal `
            --quiet --norestart --force 2>&1 | Out-Null
          Write-Host "VS workload install attempted"
        shell: pwsh
        continue-on-error: true

      - name: Restore NuGet packages
        run: dotnet restore src/GOGGUI.App/GOGGUI.App.csproj
        shell: pwsh

      # Use MSBuild for the full build+publish — avoids dotnet CLI PRI task issue.
      # /t:Publish creates the self-contained output in the PublishDir below.
      - name: Build & Publish with MSBuild
        run: |
          msbuild src/GOGGUI.App/GOGGUI.App.csproj `
            /t:Restore;Build;Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None `
            /p:PublishDir="${{ github.workspace }}\publish\GogGui\" `
            /p:PublishSingleFile=false `
            /m /nologo
        shell: pwsh

      - name: List publish output
        run: |
          Get-ChildItem publish/GogGui `
            | Select-Object Name, Length `
            | Format-Table -AutoSize
        shell: pwsh
        continue-on-error: true

      - name: Zip artifact
        run: |
          $branch = "${{ github.ref_name }}" -replace '[/\\:*?"<>|]', '-'
          $sha    = "${{ github.sha }}".Substring(0, 7)
          Compress-Archive `
            -Path publish/GogGui/* `
            -DestinationPath "publish/GogGui-x64-${branch}-${sha}.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GogGui-x64-${{ github.ref_name }}
          path: publish/GogGui-x64-*.zip
          if-no-files-found: error
          retention-days: 30
