name: Build GOGGUI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-core:
    name: Build GOGGUI.Core
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/GOGGUI.Core/GOGGUI.Core.csproj

      - name: Build Core
        run: dotnet build src/GOGGUI.Core/GOGGUI.Core.csproj --no-restore --configuration Release

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOGGUI-Core
          path: src/GOGGUI.Core/bin/Release/
          if-no-files-found: warn

  build-app:
    name: Build GOGGUI.App (WinUI 3)
    runs-on: windows-latest
    needs: build-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore App (pulls WindowsAppSDK from NuGet)
        run: dotnet restore src/GOGGUI.App/GOGGUI.App.csproj
        shell: pwsh

      - name: Build App with MSBuild
        run: |
          msbuild src/GOGGUI.App/GOGGUI.App.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:WindowsAppSDKSelfContained=true `
            /nologo
        shell: pwsh

      - name: List build output (debug)
        run: |
          Write-Host "=== bin folder ==="
          Get-ChildItem -Recurse src/GOGGUI.App/bin | Select-Object FullName, Length | Format-Table -AutoSize
        shell: pwsh
        continue-on-error: true

      - name: Upload App artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOGGUI-App
          path: src/GOGGUI.App/bin/**/*.exe
          if-no-files-found: warn
