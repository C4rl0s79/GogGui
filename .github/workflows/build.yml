name: Build & Publish GogGui

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build GogGui (WinUI 3 unpackaged / x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore src/GOGGUI.App/GOGGUI.App.csproj
        shell: pwsh

      - name: Build
        run: |
          msbuild src/GOGGUI.App/GOGGUI.App.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None `
            /m /nologo
        shell: pwsh

      - name: Publish
        run: |
          msbuild src/GOGGUI.App/GOGGUI.App.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None `
            "/p:PublishDir=${{ github.workspace }}\publish\GogGui\" `
            /m /nologo
        shell: pwsh

      - name: List publish output
        run: |
          Get-ChildItem publish/GogGui `
            | Select-Object Name, Length `
            | Format-Table -AutoSize
        shell: pwsh
        continue-on-error: true

      - name: Zip artifact
        run: |
          $branch = "${{ github.ref_name }}" -replace '[/\\:*?"<>|]', '-'
          $sha    = "${{ github.sha }}".Substring(0, 7)
          Compress-Archive `
            -Path publish/GogGui/* `
            -DestinationPath "publish/GogGui-x64-${branch}-${sha}.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GogGui-x64-${{ github.ref_name }}
          path: publish/GogGui-x64-*.zip
          if-no-files-found: error
          retention-days: 30
